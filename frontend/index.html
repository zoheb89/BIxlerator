(function(){
var s=document.createElement('style');s.textContent='.header-action{border:1px solid #c8d9e5;background:rgba(255,255,255,.7);color:#16324f;border-radius:8px;padding:8px 11px;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:7px}.header-action:hover{background:#eef7fb;border-color:#9fc7d8}.header-menu{position:fixed;z-index:1000;min-width:250px;max-width:310px;background:#fff;border:1px solid #d5e1eb;border-radius:12px;box-shadow:0 18px 50px rgba(16,42,67,.16);padding:12px;color:#17314d;font-size:11px}.header-menu h4{margin:2px 0 10px;font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:#668096}.header-menu .menu-row{padding:9px 7px;border-bottom:1px solid #edf1f5}.header-menu .menu-row:last-child{border-bottom:0}.header-menu strong{display:block;color:#17314d;font-size:11px}.header-menu small{display:block;color:#73879a;margin-top:3px;line-height:1.35}.header-menu a,.header-menu button{color:#0076a3;text-decoration:none;background:none;border:0;padding:8px 7px;font:inherit;font-weight:600;cursor:pointer}.header-menu .ok{color:#168a57}.header-menu .muted{color:#8192a5}.workspace-action{border-color:#c8d9e5!important;background:#fff!important;color:#17314d!important}.theme-toggle{white-space:nowrap}.brand-integrated{flex-direction:column!important;align-items:flex-start!important;gap:8px!important}.brand-integrated img{width:224px!important;height:60px!important;object-fit:contain!important;border-radius:10px!important;display:block!important}:root[data-theme="dark"] .header-action,:root[data-theme="dark"] .workspace-action{background:#1a2935!important;border-color:#415667!important;color:#d9e8f2!important}:root[data-theme="dark"] .header-menu{background:#17232f;border-color:#304353;color:#dbe8f2}:root[data-theme="dark"] .header-menu h4{color:#8fa6b8}:root[data-theme="dark"] .header-menu .menu-row{border-color:#293b4a}:root[data-theme="dark"] .header-menu strong{color:#f4f8fb}:root[data-theme="dark"] .header-menu sma function closeMenus(){document.querySelectorAll('.header-menu').forEach(function(x){x.remove()})}
function menu(anchor,title,html){closeMenus();var m=document.createElement('div');m.className='header-menu';m.innerHTML='<h4>'+title+'</h4>'+html;document.body.appendChild(m);var r=anchor.getBoundingClientRect();var left=Math.min(Math.max(12,r.right-m.offsetWidth),window.innerWidth-m.offsetWidth-12);m.style.left=left+'px';m.style.top=(r.bottom+8)+'px';setTimeout(function(){document.addEventListener('click',function(e){if(!m.contains(e.target)&&e.target!==anchor)m.remove()},{once:true})},0);return m}
function makeButton(label,cls){var b=document.createElement('button');b.type='button';b.className='header-action '+(cls||'');b.textContent=label;return b}
function install(){var host=document.querySelector('.top-right');if(!host)return false;if(host.dataset.polished==='1')return true;host.dataset.polished='1';
var logo=document.querySelector('.brand img');var brand=document.querySelector('.brand');if(logo){logo.src='/bixlerator-migration-logo.svg';logo.alt='BIxlerator Qlik to Power BI';logo.classList.add('brand-integrated')}if(brand)brand.classList.add('brand-integrated');
var systemIcon=Array.from(host.children).find(function(x){return x.textContent.trim()==='◔'});if(systemIcon)systemIcon.remove();
var pill=host.querySelector('.pill');if(pill){var dataBtn=makeButton('DATA & AI ▾');pill.replaceWith(dataBtn);dataBtn.onclick=function(e){e.stopPropagation();var m=menu(dataBtn,'DATA & AI HUB','<div class="menu-row"><strong>Migration engines</strong><small>QVD → CSV · Qlik → DAX · Qlik Script → Python</small></div><div class="menu-row"><strong>AI capabilities</strong><small>PII classification · documentation · dashboard concepts</small></div><div class="menu-row"><strong id="engine-health" class="muted">API status · checking…</strong><small>Runtime health only; secrets are never exposed.</small></div><button id="refresh-health">↻ Refresh status</button>');fetch('/api/health',{cache:'no-store'}).then(function(r){return r.ok?r.json():Promise.reject()}).then(function(){var el=m.querySelector('#engine-health');if(el){el.textContent='API status · Operational';el.className='ok'}}).catch(function(){var el=m.querySelector('#engine-health');if(el){el.textContent='API status · Unavailable';el.className='muted'}});var rb=m.querySelector('#refresh-health');if(rb)rb.onclick=function(){dataBtn.click()}}}
var q=Array.from(host.children).find(function(x){return x.textContent.trim()==='?'});if(q){var help=makeButton('?');help.setAttribute('aria-label','Help and resources');q.replaceWith(help);help.onclick=function(e){e.stopPropagation();menu(help,'HELP & RESOURCES','<div class="menu-row"><strong>How BIxlerator works</strong><small>Use Modules to launch a migration capability and Recent Activity to track completed jobs.</small></div><div class="menu-row"><strong>API documentation</strong><small>Open the FastAPI Swagger interface for the production endpoints.</small></div><a href="/api/docs" target="_blank" rel="noopener">Open API Docs →</a><button id="about-link">About this App →</button>');var a=document.querySelector('.header-menu #about-link');if(a)a.onclick=function(){var target=Array.from(document.querySelectorAll('.nav')).find(function(x){return x.textContent.indexOf('About this App')>=0});if(target)target.click();closeMenus()}}}
var av=host.querySelector('.avatar');var userText=Array.from(host.children).find(function(x){return x.textContent.trim().indexOf('Zoheb')===0});if(av)av.remove();if(userText)userText.remove();var ws=makeButton('Workspace ▾','workspace-action');host.appendChild(ws);ws.onclick=function(e){e.stopPropagation();menu(ws,'WORKSPACE','<div class="menu-row"><strong>Enterprise Migration Studio</strong><small>BIxlerator workspace · v1.0</small></div><div class="menu-row"><strong>Authentication</strong><small class="muted">No sign-in/profile service is enabled in this deployment.</small></div><button id="workspace-about">Open About this App →</button>');var a=document.querySelector('.header-menu #workspace-about');if(a)a.onclick=function(){var target=Array.from(document.querySelectorAll('.nav')).find(function(x){return x.textContent.indexOf('About this App')>=0});if(target)target.click();closeMenus()}};
var theme=makeButton('');theme.className='header-action theme-toggle';function renderTheme(){var d=document.documentElement.dataset.theme==='dark';theme.textContent=d?'☀ Light':'◐ Dark';theme.title=d?'Switch to light mode':'Switch to dark mode'}theme.onclick=function(){var n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;try{localStorage.setItem('bixlerator-theme',n)}catch(e){}renderTheme()};renderTheme();host.insertBefore(theme,host.firstChild);return true}
var n=0,t=setInterval(function(){if(install()||++n>60)clearInterval(t)},100);window.addEventListener('resize',closeMenus);window.addEventListener('scroll',closeMenus,true);
})();
</script><script>(function(){async function syncKpis(){try{var r=await fetch('/api/dashboard',{cache:'no-store'});if(!r.ok)return;var d=await r.json(),k=d.kpis||{},cards=document.querySelectorAll('.kpi-card');if(cards.length<4)return;var values=[k.qvd_assets_converted??0,k.pii_columns_secured??0,k.dax_expressions??0,(k.avg_conversion_seconds??0)+'s'];var notes=['+'+(k.qvd_this_week??0)+' this week','actual protected columns','+'+(k.dax_this_week??0)+' this week','completed assets'];cards.forEach(function(card,i){var value=card.querySelector('strong'),note=card.querySelector('small');if(value)value.textContent=values[i];if(note)note.textContent=notes[i]})}catch(e){}}setInterval(syncKpis,1000);syncKpis()})();</script></body></html>
